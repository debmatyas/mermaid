<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamikus Mermaid Generátor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; max-width: 600px; font-family: monospace; font-size: 14px; }
        #mermaid_div { margin-top: 20px; }
        .error-msg { color: #d32f2f; background: #ffebee; padding: 12px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>

<body>

    <textarea name="code" id="mermaid_code" rows="8" placeholder="Írd ide a mermaid kódot..."></textarea>
    <div id="mermaid_div"></div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ startOnLoad: false });

        const input = document.querySelector('#mermaid_code');
        const mermaidDiv = document.querySelector('#mermaid_div');

        const initialCode = `graph TD;\n    A-->B;\n    A-->C;\n    B-->D;\n    C-->D;`;
        input.value = initialCode;

        async function updateMermaid() {
            const code = input.value;
            
            if (!code.trim()) {
                mermaidDiv.innerHTML = '';
                return;
            }

            try {
                // 1. Szintaktikai ellenőrzés
                await mermaid.parse(code);

                // 2. Renderelés
                const id = 'mermaid-' + Math.floor(Math.random() * 100000);
                const { svg } = await mermaid.render(id, code);
                mermaidDiv.innerHTML = svg;
                
            } catch (error) {
                // 3. Kiírjuk a pontos hibaüzenetet, amit a Mermaid (vagy a parse) adott
                const errorMessage = error.str || error.message || error;
                mermaidDiv.innerHTML = `<div class="error-msg"><strong>Szintaktikai hiba:</strong>\n${errorMessage}</div>`;
            }
        }

        // Oldal betöltésekor futtatás
        updateMermaid();

        // Gépelés figyelése
        input.addEventListener('input', updateMermaid);
    </script>
</body>

</html>
